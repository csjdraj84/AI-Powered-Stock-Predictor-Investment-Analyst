# docker-compose.yml — compatible with Hostinger VPS Docker Manager
# Uses Compose Spec (no explicit "version:" key, which is deprecated in modern Compose)

services:
  stock-analyst-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicitly target linux/amd64 for Hostinger VPS (x86_64)
      args:
        BUILDPLATFORM: linux/amd64
    image: stock-analyst-app:latest
    container_name: stock-analyst-container

    # ── Port mapping ──────────────────────────────────────────────────────────
    # Hostinger Docker Manager: map the internal Streamlit port to the host.
    # Change the left side (host port) to match your Hostinger port assignment.
    ports:
      - "8501:8501"

    # ── Environment variables ─────────────────────────────────────────────────
    # Sensitive values (API keys, secrets) should be added via Hostinger's
    # "Environment Variables" panel rather than hardcoding them here.
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Uncomment and set if your app needs API keys:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}

    # ── Persistent storage ────────────────────────────────────────────────────
    # Uses a named Docker volume (supported by Hostinger) instead of a bind
    # mount (host path volume), which is not reliably supported in Hostinger's
    # Docker Manager UI.
    volumes:
      - app_data:/app/data

    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # ── Restart policy (for standalone docker compose, not Swarm) ────────────
    restart: unless-stopped

    # ── Healthcheck ───────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ── Logging ───────────────────────────────────────────────────────────────
    # json-file driver with rotation — prevents disk fill on the VPS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  app_data:
    driver: local
